<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <div class="card">

        <div class="search">
            <input type="text" name="username" placeholder="Enter city name">
            <button>
                <img src="./magnifier-glass.png" width="20px" height="20px">
            </button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>

        <div class="weather">
            <img src="./weather-icon.png" alt="" class="weather-icon">
            <h2 class="city">Hyderabad</h2>
            <h2 class="temperature">45°C</h2>
            <div class="details">
                <div class="column">
                    <img src="./the-simpsons-family-humidity.png" alt="">
                    <div>
                        <p class="humidity">48%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="column">
                    <img src="./animated-wind-image-0001.gif" alt="">
                    <div>
                        <p class="wind">40km/h</p>
                        <p>Wind</p>
                    </div>
                </div>
            </div>

        </div>



    </div>



<script src="./app.js"></script>
</body>

</html>
